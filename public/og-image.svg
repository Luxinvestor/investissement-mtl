<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#1c1917"/>
  <!-- Fond gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Logo centré — barres histogramme + toit -->
  <g transform="translate(520, 200) scale(4)">
    <rect x="2" y="20" width="6" height="10" rx="1" fill="#059669" opacity="0.75"/>
    <rect x="10" y="13" width="6" height="17" rx="1" fill="#059669" opacity="0.88"/>
    <rect x="18" y="18" width="6" height="12" rx="1" fill="#059669" opacity="0.75"/>
    <rect x="26" y="8" width="6" height="22" rx="1" fill="#059669"/>
    <polyline points="23,9 29,2 35,9" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Titre -->
  <text x="600" y="370" text-anchor="middle" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#059669">Stock</text>
  <text x="720" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="52" font-weight="300" fill="#78716c"> or </text>
  <text x="850" y="370" text-anchor="middle" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#f5f5f4">Stone</text>

  <!-- Sous-titre -->
  <text x="600" y="430" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" fill="#78716c" letter-spacing="3">SIMULATEUR · ÎLE DE MONTRÉAL · 2026</text>

  <!-- Description -->
  <text x="600" y="500" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#a8a29e">Immo vs Bourse — fiscalité québécoise incluse</text>
</svg>
